# Конфигурация MediaMTX для foreca-cctv.
#
# Задача: регистратор должен получать поток всегда, даже когда сервис
# перезапускается или упал. Это делает alwaysAvailable + offline-заглушка.
#
# Две ссылки на один поток:
#   rtsp://host:8554/weather      — путь публикации
#   rtsp://host:8554/weather_sub  — редирект на основной путь
#
# Редирект выбран вместо второй публикации: одно кодирование, один процесс
# FFmpeg, одна точка отказа. Проверено, что при отсутствии публикации обе
# ссылки отдают заглушку.

logLevel: info

# Транспорты RTSP. TCP — основной: он предсказуем через NAT и Wi-Fi.
# UDP оставлен включённым, потому что часть регистраторов просит именно его:
# без него они получают «461 Unsupported Transport» и канал не добавляется.
rtsp: yes
rtspTransports: [tcp, udp]
rtspAddress: :8554
# Адреса UDP-слушателей нужны только для udp в rtspTransports.
rtpAddress: :8000
rtcpAddress: :8001

# Остальные протоколы сервису не нужны.
rtmp: no
hls: no
webrtc: no
srt: no

# Аутентификация читателей пока не требуется (осознанное решение владельца).
authMethod: internal

paths:
  weather:
    # Заглушка вместо 404: регистратор видит канал всегда.
    alwaysAvailable: yes
    alwaysAvailableFile: ./assets/offline/no-data.mp4
    # Заглушка не должна попадать в архив как содержимое канала.
    alwaysAvailableRecorded: no
    # Без аутентификации: поток смотрит только NVR в локальной сети.
    # При необходимости включите readUser/readPass.
    source: publisher

  weather_sub:
    # ВАЖНО: именно pull-прокси, а не redirect.
    #
    # `source: redirect` отдаёт 302 с Location, а MediaMTX формирует его из
    # внутреннего адреса (127.0.0.1:8554) — регистратор пошёл бы на свой
    # localhost. Кроме того, большинство NVR редиректы в RTSP не поддерживают
    # и показывают канал неактивным.
    #
    # Прокси отдаёт настоящий поток по этому же пути: тот же битрейт, тот же
    # кодировщик, без второго кодирования.
    source: rtsp://127.0.0.1:8554/weather
    # Заглушка нужна и здесь: пока основной путь её отдаёт, прокси подхватит
    # поток только когда появится публикация.
    sourceOnDemand: no
